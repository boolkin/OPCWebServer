<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>АОМ Монитор</title>
<script src="libs/tw.js"></script>
<link href="libs/css2.css" rel="stylesheet">
<link rel="stylesheet" href="libs/all.min.css">
<link rel="stylesheet" href="libs/styles.css">
<script>
tailwind.config = { theme: { extend: { fontFamily: {
    mono: ['"JetBrains Mono"', 'monospace'],
    sans: ['"Manrope"', 'sans-serif'],
}}}};
</script>
<style>
.viewer-block .block-header { cursor: default; }
.viewer-widget { cursor: default; }
</style>
</head>
<body class="font-sans">

<!-- Тулбар -->
<header class="toolbar">
    <div class="flex items-center gap-3">
        <div class="toolbar-logo">
            <div class="toolbar-logo-dot"></div>
            <span class="toolbar-logo-text">OPC Dashboard</span>
        </div>
        <div class="poll-status" id="poll-status">
            <div class="poll-dot" id="poll-dot"></div>
            <span id="poll-label">не подключено</span>
        </div>
    </div>
    <div class="toolbar-actions">
        <button class="toolbar-btn" onclick="toggleTheme()" title="Переключить тему">
            <i class="fas fa-sun" id="theme-icon"></i>
        </button>
        <div class="toolbar-sep"></div>
        <a href="#" onclick="openEditor(event)" class="toolbar-btn" title="Открыть редактор" style="text-decoration:none;">
            <i class="fas fa-pen-to-square"></i> Редактор
        </a>
    </div>
</header>

<!-- Дашборд -->
<main class="dashboard-main">
    <div id="dashboard-canvas"></div>
</main>

<datalist id="addr-datalist" style="display:none;"></datalist>
<div class="toast-container" id="toast-container"></div>

<script src="libs/common.js"></script>
<script src="libs/viewer.js"></script>
<script>
function openEditor(e) {
    e.preventDefault();
    var pwd = prompt('Введите пароль:');
    if (pwd === '12345') {
        window.location.href = 'editor.html';
    } else if (pwd !== null) {
        toast('Неверный пароль', 'error');
    }
}
</script>
</body>
</html>
