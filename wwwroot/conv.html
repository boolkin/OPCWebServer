<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Конвертер Таблицы в JSON</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        textarea { width: 100%; height: 150px; margin-bottom: 10px; }
        pre { background: #f4f4f4; padding: 10px; border: 1px solid #ccc; overflow-x: auto; }
    </style>
</head>
<body>
    <h3>Вставьте строки таблицы (через табуляцию):</h3>
    <textarea id="input" placeholder="0	numeric.sin.int16	0,5	50	s"></textarea>
    <button onclick="convert()">Преобразовать</button>

    <h3>Результат JSON:</h3>
    <pre id="output"></pre>

    <script>
        function convert() {
            const input = document.getElementById('input').value.trim();
            const lines = input.split('\n');
            
            const tags = lines.map((line, index) => {
                const cols = line.split('\t');
                if (cols.length < 5) return null;

                const address = cols[1];
                const multiplier = parseFloat(cols[2].replace(',', '.'));
                const offset = parseFloat(cols[3].replace(',', '.'));
                const typeFlag = cols[4].trim();

                // Определяем тип данных и инверсию
                let dataType = "float";
                let invert = false;

                if (typeFlag.includes('b')) {
                    dataType = "bool";
                } else if (typeFlag === 't') {
                    dataType = "text";
                }

                if (typeFlag.startsWith('!')) {
                    invert = true;
                }

                return {
                    "Id": index + 1,
                    "Address": address,
                    "DataType": dataType,
                    "Multiplier": multiplier,
                    "Offset": offset,
                    "Invert": invert,
                    "UdpSend": false
                };
            }).filter(tag => tag !== null);

            document.getElementById('output').textContent = JSON.stringify({ "Tags": tags }, null, 2);
        }
    </script>
</body>
</html>
